name: Mise à jour mensuelle de la carte

on:
  schedule:
    # Le 1er de chaque mois à 6h00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer même si aucune nouvelle version des données n'est détectée"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer la carte
        run: |
          python -m src.main ${{ inputs.force && '--force' || '' }}

      - name: Committer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/state.json data/cache/geocode_cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Mise à jour mensuelle des données EGALIM"
            git push
          fi
